[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "archhold"
version = "0.1.0"
description = "Load factor of a small roof mesh. The digest is bytes, not a stamp."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Digital Currensy Inc." }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
archhold = "archhold.__main__:main"
